<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>DeepSeek 管理 · HSD 图号助手</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script>window.HSD_TOKEN = __HSD_TOKEN__;</script>
  <script src="/static/admin.js" defer></script>
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div><a class="back-link" href="/">← 返回图片编号</a><h1>DeepSeek 管理</h1></div>
      <div class="header-actions">
        <button id="admin-refresh" class="button secondary" type="button">重新读取</button>
        <button id="admin-logout" class="button secondary" type="button">退出登录</button>
      </div>
    </header>
    <div id="admin-message" class="notice hidden" role="status" aria-live="polite"></div>
    <main>
      <section class="panel settings-panel" aria-labelledby="settings-heading">
        <div class="section-heading">
          <div><h2 id="settings-heading">复核设置</h2><p id="model-label">正在读取…</p></div>
          <form id="enable-form">
            <label class="enable-control"><input id="ai-enabled" type="checkbox" disabled><span>启用复核</span></label>
            <button id="enable-save" class="button secondary" type="submit" disabled>保存</button>
          </form>
        </div>
        <p id="settings-state" class="state-line">正在读取…</p>
        <div id="storage-warning" class="notice warning hidden" role="alert"></div>
      </section>

      <section class="panel keys-panel" aria-labelledby="keys-heading">
        <div class="section-heading"><div><h2 id="keys-heading">API Key <span id="key-count" class="count"></span></h2></div></div>
        <form id="key-add-form" class="add-form" autocomplete="off">
          <textarea id="key-batch" rows="3" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="每行一个 API Key" disabled></textarea>
          <div class="add-actions"><button id="key-add" class="button primary" type="submit" disabled>添加 Key</button></div>
        </form>
        <div id="key-list" class="key-list" aria-live="polite"><p class="empty">正在读取…</p></div>
      </section>

      <section class="panel debug-panel" aria-labelledby="debug-heading">
        <div class="section-heading">
          <div><h2 id="debug-heading">实时调试</h2><p id="debug-connection" role="status">正在连接…</p></div>
          <label class="check-control"><input id="debug-follow" type="checkbox" checked>跟随最新</label>
        </div>
        <div id="debug-gap" class="notice warning hidden" role="status"></div>
        <div id="debug-active" class="active-list" aria-live="polite"></div>
        <div id="debug-log" class="debug-log" tabindex="0" aria-label="DeepSeek 调试记录"><p id="debug-empty" class="empty">暂无记录。</p><ol id="debug-events" class="events"></ol></div>
      </section>

      <section class="panel ledger-panel" aria-labelledby="ledger-heading">
        <div class="section-heading"><div><h2 id="ledger-heading">Key 账本</h2><p id="ledger-state">正在读取…</p></div></div>
        <p class="ledger-warning">明文仅在本机管理员分区显示，截图或录屏会暴露密钥。</p>
        <div id="ledger-list" class="ledger-list"><p class="empty">暂未添加 Key。</p></div>
      </section>
    </main>
  </div>
</body>
</html>
