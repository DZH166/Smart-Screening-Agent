<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>DeepSeek 管理 · HSD 图号助手</title>
  <link rel="stylesheet" href="/static/admin.css">
  <script>window.HSD_TOKEN = __HSD_TOKEN__;</script>
  <script src="/static/admin.js" defer></script>
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div><a class="back-link" href="/">← 返回图片编号</a><h1>DeepSeek 管理</h1></div>
      <button id="admin-refresh" class="button secondary" type="button">刷新设置</button>
    </header>
    <div id="admin-message" class="notice hidden" role="status" aria-live="polite"></div>
    <main>
      <section class="panel settings-panel" aria-labelledby="settings-heading">
        <div class="section-heading">
          <h2 id="settings-heading">AI 开关</h2>
          <form id="enable-form">
            <label class="enable-control"><input id="ai-enabled" type="checkbox" disabled><span>启用 DeepSeek</span></label>
            <button id="enable-save" class="button secondary" type="submit" disabled>保存</button>
          </form>
        </div>
        <p id="settings-state" class="state-line">正在读取设置…</p>
        <div id="storage-warning" class="notice warning hidden" role="alert"></div>
        <details class="details"><summary>使用说明</summary><div class="detail-body">
          <p>员工共用主机 Key，无需重复配置。保存成功不代表接口已验证。认证或余额异常修复后，可先停用再启用对应 Key；多个 Key 不增加官方账号额度。</p>
          <p>启用后发送可处理的表格图片和 AI 预览查找对应，同时由本机独立核验。模型建议不能解除文件硬异常。原始 XLSX、ZIP、AI 文件和本机路径不会发送。</p>
          <p id="qualification-state"></p><p id="persistence-state"></p>
        </div></details>
      </section>
      <section class="panel keys-panel" aria-labelledby="keys-heading">
        <div class="section-heading"><h2 id="keys-heading">API Key <span id="key-count" class="count"></span></h2></div>
        <form id="key-add-form" class="add-form" autocomplete="off">
          <label for="key-batch">添加 Key</label>
          <div class="add-input"><textarea id="key-batch" rows="2" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="batch-help" placeholder="每行粘贴一个 API Key" disabled></textarea><button id="key-add" class="button primary" type="submit" disabled>添加 Key</button></div>
          <p id="batch-help" class="muted">每行一个，最多 100 个；提交即清空，不回显密钥。</p>
        </form>
        <div id="key-list" class="key-list" aria-live="polite"><p class="empty">正在读取 Key…</p></div>
      </section>
    </main>
  </div>
</body>
</html>
