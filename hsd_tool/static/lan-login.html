<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSD 图号助手 · 局域网测试</title>
<style>body{margin:0;background:#f5f7fa;color:#25304a;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(360px,80vw);padding:32px;background:white;border:1px solid #e2e7ef;border-radius:16px}h1{font-size:22px}p{font-size:14px;line-height:1.8;color:#65718a}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;margin-top:12px;font:inherit}input{border:1px solid #c8d0de}button{border:0;background:#365fd7;color:white;cursor:pointer}#message{color:#b24635;min-height:24px}</style></head>
<body><main><h1>HSD 图号助手</h1><p>局域网共享测试。请输入主机提供的访问码。文件和结果保存在主机上。</p><form id="login"><label for="code">访问码</label><input id="code" type="password" autocomplete="off" required autofocus><button id="submit">进入测试</button><p id="message" role="alert"></p></form></main><script>
'use strict';
document.getElementById('login').addEventListener('submit',async(event)=>{event.preventDefault();const input=document.getElementById('code'),button=document.getElementById('submit'),message=document.getElementById('message');button.disabled=true;message.textContent='';const code=input.value;input.value='';try{const response=await fetch('/api/lan/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code}),cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'无法进入测试。');location.reload();}catch(error){message.textContent=error.message||'无法连接主机。';}finally{button.disabled=false;}});
</script></body></html>
