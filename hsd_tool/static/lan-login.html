<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSD 图号助手 · 员工入口</title>
<style>body{margin:0;background:#f5f7fa;color:#243247;font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh}main{box-sizing:border-box;width:min(410px,calc(100vw - 32px));padding:28px;background:#fff;border:1px solid #dce3ec;border-radius:10px}h1{font-size:23px;line-height:1.4;margin:0}p{font-size:14px;color:#58677b;margin:12px 0 20px}label{font-weight:600;display:block}input,button{box-sizing:border-box;width:100%;padding:11px 12px;border-radius:7px;font:inherit}input{border:1px solid #bac7d8;margin-top:7px}button{border:1px solid #315adf;background:#315adf;color:white;cursor:pointer;margin-top:18px;font-weight:600}button:hover:not(:disabled){background:#2446bb}button:disabled{opacity:.6;cursor:wait}input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #91a9ff;outline-offset:3px}#message{color:#ae3939;margin:12px 0 0;min-height:24px}details{margin-top:18px;border-top:1px solid #dce3ec;padding-top:14px}summary{cursor:pointer;color:#405978;font-size:13px}details p{font-size:13px;margin:10px 0 0}</style></head>
<body><main><h1>HSD 图号助手</h1><p>员工入口 · 输入主机提供的访问码。</p><form id="login"><label for="code">访问码</label><input id="code" type="password" autocomplete="off" aria-describedby="message" required autofocus><button id="submit">进入工具</button><p id="message" role="alert"></p></form><details><summary>使用帮助</summary><p>进入后上传自己的表格和 AI 压缩包，处理完成即可下载结果。DeepSeek 沿用主机配置，无需填写密钥。</p><p>请连接公司局域网。没有访问码或无法连接时，请联系主机管理员。</p></details></main><script>
'use strict';
document.getElementById('login').addEventListener('submit',async(event)=>{event.preventDefault();const input=document.getElementById('code'),button=document.getElementById('submit'),message=document.getElementById('message');if(button.disabled)return;button.disabled=true;button.textContent='正在进入…';input.removeAttribute('aria-invalid');message.textContent='';const code=input.value;input.value='';try{const response=await fetch('/api/lan/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code}),cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'无法进入，请检查访问码后重试。');location.reload();}catch(error){message.textContent=error.message||'无法连接主机，请确认主机工具仍在运行后重试。';input.setAttribute('aria-invalid','true');input.focus();}finally{button.disabled=false;button.textContent='进入工具';}});
</script></body></html>
