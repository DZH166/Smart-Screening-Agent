<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>丝带设计 · 模型服务</title>
  <link rel="stylesheet" href="../../hsd_tool/static/admin.css">
  <link rel="stylesheet" href="../../hsd_tool/static/admin-console.css">
</head>
<body>
<div style="position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:99;padding:8px 16px;border-radius:999px;background:#17233a;color:#fff;font:13px/1.4 system-ui,sans-serif;letter-spacing:.02em">静态预览 · 按钮不会真的保存</div>

  <div class="admin-shell">
    <header class="admin-header">
      <div class="header-title">
        <a class="back-link" href="/admin#keys">← 返回 Key 账本</a>
        <h1>丝带设计 · 模型服务</h1>
        <p class="build-line" id="admin-build">构建 1.20.0+preview</p>
      </div>
      <div class="header-actions">
        <button id="ribbon-refresh" class="button secondary" type="button">刷新设置</button>
      </div>
    </header>
    <div id="ribbon-message" class="notice hidden" role="status" aria-live="polite"></div>
    <a id="ribbon-login" class="button primary hidden" href="/admin/login">重新登录</a>
    <main class="console">
      <section class="panel">
        <div class="card-head">
          <div class="card-title">
            <p class="eyebrow">SERVICE · RIBBON</p>
            <h2>沿用 Key 账本中的模型</h2>
            <p class="card-desc">丝带设计与素材提取使用同一组 DeepSeek 与火山方舟配置，这里不重复保存 Key。</p>
          </div>
        </div>
        <div id="ribbon-settings-panel" class="ribbon-form-host">
    <p id="ribbon-inherited-status" class="ribbon-inherit" role="status" aria-live="polite">已就绪：deepseek-flash ＋ doubao-seedream-5-0-flash-260915</p>
    <label class="ribbon-switch"><input type="checkbox" checked><span>启用丝带 AI 底图与精修</span></label>
    <p class="muted ribbon-note">启用后按实际调用计费；关闭后首稿排版照常可用。</p>
    <p class="ribbon-state">已启用。</p>
    <div class="ribbon-actions">
      <button type="button" class="button primary">保存</button>
      <button type="button" class="button secondary">重新读取</button>
    </div>
</div>
      </section>
    </main>
  </div>
</body>
</html>
